<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f4efe6" />
  <meta name="description" content="股票本本 · 港股美股即時報價 PWA" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qt.gtimg.cn https://smartbox.gtimg.cn https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />
  <title>股票本本</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js" defer></script>
  <style>
    :root {
      --bg: #f4efe6;
      --bg-elevated: #fffdf9;
      --glass: #fffdf9;
      --glass-border: rgba(23, 19, 15, 0.07);
      --glass-strong: #fffdf9;
      --text: #17130f;
      --text-secondary: #6b6154;
      --text-tertiary: #a39a8c;
      --up: #0f8a5f;
      --down: #d93a34;
      --up-bg: rgba(15, 138, 95, 0.12);
      --down-bg: rgba(217, 58, 52, 0.12);
      --accent: #1f6f5c;
      --accent-soft: rgba(31, 111, 92, 0.10);
      --warn: #b7791f;
      --hairline: rgba(23, 19, 15, 0.07);
      --shadow: 0 1px 2px rgba(40, 30, 20, 0.04);
      --shadow-sm: 0 1px 2px rgba(40, 30, 20, 0.04);
      --shadow-md: 0 6px 20px -8px rgba(40, 30, 20, 0.16);
      --radius-pill: 999px;
      --radius-card: 16px;
      --nav-height: 62px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text); font-family: var(--font);
      overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
      position: fixed; width: 100%; inset: 0;
    }
    body { padding-top: var(--safe-top); padding-left: var(--safe-left); padding-right: var(--safe-right); }
    body.modal-open { overflow: hidden; }
    body.modal-open .page { overflow: hidden !important; touch-action: none; }
    body::before {
      content: ""; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 15% -8%, rgba(47, 111, 237, 0.10), transparent 52%),
        radial-gradient(ellipse 55% 40% at 92% 8%, rgba(14, 168, 106, 0.08), transparent 48%),
        radial-gradient(ellipse 50% 35% at 50% 105%, rgba(230, 59, 58, 0.05), transparent 42%);
      pointer-events: none; z-index: 0;
    }
    #app {
      position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
    }
    .status-bar {
      flex-shrink: 0; min-height: 0; max-height: 0; overflow: hidden;
      background: rgba(196, 123, 10, 0.12); border-bottom: 1px solid rgba(196, 123, 10, 0.25);
      color: var(--warn); font-size: 12px; font-weight: 600; text-align: center;
      transition: max-height 0.28s ease, padding 0.28s ease, opacity 0.28s ease;
      display: flex; align-items: center; justify-content: center;
      padding: 0 12px; opacity: 0; pointer-events: none; white-space: normal; line-height: 1.3;
      position: relative; z-index: 20;
    }
    .status-bar.show { max-height: 48px; padding: 8px 12px; opacity: 1; }
    .status-bar.offline { background: rgba(230, 59, 58, 0.10); border-bottom-color: rgba(230, 59, 58, 0.28); color: var(--down); }
    .status-bar.warn { background: rgba(183, 121, 31, 0.12); border-bottom-color: rgba(183, 121, 31, 0.28); color: var(--warn); }
    .status-bar.session { background: rgba(47, 111, 237, 0.10); border-bottom-color: rgba(47, 111, 237, 0.22); color: var(--accent); }
    .status-bar.session.open { background: rgba(14, 168, 106, 0.12); border-bottom-color: rgba(14, 168, 106, 0.28); color: var(--up); }
    .status-bar.session.closed { background: rgba(0,0,0,0.04); border-bottom-color: rgba(0,0,0,0.08); color: var(--text-secondary); }
    .header {
      flex-shrink: 0; padding: 12px 20px 8px; display: flex; align-items: center; justify-content: space-between;
      overscroll-behavior: none; touch-action: manipulation; position: relative; z-index: 5;
    }
    .header-left { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .header h1 { font-size: 26px; font-weight: 750; letter-spacing: -0.7px; line-height: 1.15; }
    .updated-at {
      font-size: 12px; font-weight: 500; color: var(--text-tertiary);
      font-variant-numeric: tabular-nums; letter-spacing: -0.1px;
      line-height: 1.2;
    }
    .updated-at.fresh { color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .pill {
      height: 40px; min-width: 40px; padding: 0 16px; border-radius: var(--radius-pill);
      border: 1px solid var(--hairline); background: var(--bg-elevated);
      color: var(--text); font-size: 14px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.2s;
      user-select: none; box-shadow: var(--shadow-sm); font-family: inherit;
    }
    .pill:active { transform: scale(0.94); }
    .pill.icon-only { width: 40px; padding: 0; }
    .pill.primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(47, 111, 237, 0.28); }
    .pill.ghost { background: transparent; box-shadow: none; }
    .pages { flex: 1; position: relative; overflow: hidden; overscroll-behavior: none; min-height: 0; touch-action: none; }
    .page {
      position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
      overscroll-behavior-y: contain; overscroll-behavior-x: none;
      touch-action: pan-y;
      padding: 8px 16px calc(var(--nav-height) + var(--safe-bottom) + 48px);
      -webkit-overflow-scrolling: touch; opacity: 0; transform: translateX(24px); pointer-events: none;
      transition: opacity 0.32s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.32s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .page.active { opacity: 1; transform: none; pointer-events: auto; z-index: 1; }
    .page.exit-left { opacity: 0; transform: translateX(-24px); z-index: 0; }
    .card {
      background: var(--bg-elevated); border: 1px solid var(--hairline); border-radius: var(--radius-card);
      padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
    }
    .card:active { transform: scale(0.99); box-shadow: var(--shadow-md); }
    .card.stock-row { position: relative; overflow: hidden; }
    .card.stock-row::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: transparent; transition: background .2s;
    }
    .card.stock-row:has(.stock-change.up)::before { background: var(--up); }
    .card.stock-row:has(.stock-change.down)::before { background: var(--down); }
    .card.static { cursor: default; }
    .card.static:active { transform: none; }
    .stock-row { display: flex; align-items: center; gap: 12px; }
    .drag-handle {
      flex: 0 0 32px; width: 32px; height: 40px; border: 0; border-radius: 10px;
      background: transparent; color: var(--text-tertiary); font: inherit; font-size: 20px;
      cursor: grab; touch-action: none; user-select: none;
    }
    .drag-handle:active { cursor: grabbing; color: var(--accent); }
    .stock-row.dragging { opacity: 0.65; box-shadow: var(--shadow-md); }
    .stock-info { flex: 1; min-width: 0; }
    .stock-name { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; white-space: normal; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
    .stock-code { font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .stock-price-block { text-align: right; }
    .stock-price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.6px; }
    .stock-change {
      font-size: 12px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums;
      display: inline-flex; align-items: center; padding: 1px 7px; border-radius: var(--radius-pill);
    }
    .stock-change.up { color: var(--up); background: var(--up-bg); }
    .stock-change.down { color: var(--down); background: var(--down-bg); }
    .stock-change.flat { color: var(--text-secondary); background: rgba(0,0,0,0.04); }
    .search-box { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-input {
      flex: 1; height: 44px; border-radius: var(--radius-pill); border: 1px solid var(--glass-border);
      background: var(--glass-strong); color: var(--text); font-size: 16px; padding: 0 18px; outline: none; box-shadow: var(--shadow);
    }
    .search-input::placeholder { color: var(--text-tertiary); }
    .search-input:focus { border-color: rgba(47, 111, 237, 0.45); }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.45; }
    .bottom-nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(10px + var(--safe-bottom));
      width: min(360px, calc(100% - 32px));
      height: auto;
      min-height: var(--nav-height);
      background: #fffdf9; border: 1px solid var(--hairline); border-radius: var(--radius-pill);
      display: flex; align-items: center; justify-content: space-around;
      padding: 8px 6px;
      z-index: 1000; isolation: isolate;
      box-shadow: 0 -2px 24px -6px rgba(40, 30, 20, 0.10);
      touch-action: manipulation; overscroll-behavior: none;
      pointer-events: auto;
    }
    .nav-item {
      flex: 1; min-height: 48px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px 5px;
      color: var(--text-tertiary); font-size: 11px; font-weight: 600; cursor: pointer;
      background: transparent; border: none; font-family: inherit;
      position: relative; line-height: 1.15;
      overflow: visible;
    }
    .nav-item span {
      display: block; white-space: nowrap;
      transform: translateZ(0); /* 避免字被裁切 */
    }
    .nav-item.active {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .nav-item svg { width: 20px; height: 20px; stroke-width: 1.9; flex-shrink: 0; }
    .toast-container {
      position: fixed; top: calc(var(--safe-top) + 56px); left: 50%; transform: translateX(-50%);
      z-index: 3000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
      width: min(340px, calc(100% - 32px));
    }
    .toast {
      display: flex; align-items: center; gap: 12px;
      background: #fffdf9; border: 1px solid var(--hairline); border-radius: 16px;
      padding: 14px 16px; color: var(--text);
      box-shadow: 0 10px 40px -12px rgba(40, 30, 20, 0.28), 0 2px 8px rgba(40, 30, 20, 0.06);
      animation: toast-in 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden; position: relative;
    }
    .toast::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--accent);
    }
    .toast-icon {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      background: var(--accent-soft); color: var(--accent);
    }
    .toast-body { flex: 1; min-width: 0; text-align: left; }
    .toast-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.25; }
    .toast-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.3; }
    .toast.success::before { background: var(--up); }
    .toast.success .toast-icon { background: var(--up-bg); color: var(--up); }
    .toast.error::before { background: var(--down); }
    .toast.error .toast-icon { background: var(--down-bg); color: var(--down); }
    .toast.warn::before { background: var(--warn); }
    .toast.warn .toast-icon { background: rgba(183, 121, 31, 0.12); color: var(--warn); }
    .toast.session::before { background: var(--accent); }
    .toast.session .toast-icon { background: var(--accent-soft); color: var(--accent); }
    .toast.out { animation: toast-out 0.28s cubic-bezier(0.4, 0, 1, 1) forwards; }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-20px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-12px) scale(0.96); }
    }
    .interval-btn.active {
      background: var(--accent) !important; color: #fff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px rgba(31, 111, 92, 0.28) !important;
    }
    .interval-btn.pop { animation: interval-pop 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes interval-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .modal-overlay { position: fixed; inset: 0; background: rgba(40, 30, 20, 0.35); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal {
      position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 252, 247, 0.98);
      border: 1px solid var(--glass-border); border-bottom: none; border-radius: 28px 28px 0 0;
      backdrop-filter: blur(32px); padding: 12px 20px calc(24px + var(--safe-bottom));
      z-index: 160; transform: translateY(100%); transition: transform 0.38s cubic-bezier(0.25, 0.8, 0.25, 1);
      max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      box-shadow: 0 -8px 40px rgba(60, 45, 25, 0.12);
    }
    .modal.show { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 2px; margin: 0 auto 16px; }
    .detail-price { font-size: 42px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .detail-item { background: rgba(0,0,0,0.03); border-radius: 14px; padding: 12px 14px; }
    .detail-item label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
    .detail-item span { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .pill { flex: 1; height: 48px; font-size: 15px; }
    .skeleton {
      background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0; }
    .refresh-dot.pulse { opacity: 1; animation: pulse 0.8s ease; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 8px 4px 12px; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .preset { height: 36px; padding: 0 14px; font-size: 13px; }
    .fail-text { color: var(--text-tertiary); font-size: 14px; }
    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    .auth-form input {
      height: 44px; border-radius: 14px; border: 1px solid var(--glass-border);
      background: var(--glass-strong); color: var(--text); font-size: 15px; padding: 0 14px; outline: none; font-family: inherit;
    }
    .auth-row { display: flex; gap: 8px; }
    .auth-row .pill { flex: 1; }
    .user-badge { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="app">
    <div class="status-bar" id="status-bar" role="status" aria-live="polite"></div>
    <header class="header">
      <div class="header-left">
        <h1 id="page-title">自選</h1>
        <div class="updated-at" id="updated-at">尚未更新</div>
      </div>
      <div class="header-actions">
        <div class="refresh-dot" id="refresh-dot" aria-hidden="true"></div>
        <button class="pill icon-only" id="btn-refresh" aria-label="重新整理">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
      </div>
    </header>
    <div class="pages">
      <section class="page active" id="page-watchlist" data-title="自選"><div id="watchlist-content"></div></section>
      <section class="page" id="page-markets" data-title="市場">
        <div class="section-title">主要指數</div>
        <div id="markets-content"></div>
      </section>
      <section class="page" id="page-search" data-title="搜尋">
        <div class="search-box">
          <input class="search-input" id="search-input" type="text" placeholder="輸入代碼或名稱，如 00700、騰訊、AAPL" autocomplete="off" spellcheck="false" />
          <button class="pill primary" id="btn-search">查詢</button>
        </div>
        <div class="section-title">搜尋結果</div>
        <div id="search-result"></div>
        <div class="section-title">快速加入</div>
        <div class="presets" id="presets"></div>
      </section>
      <section class="page" id="page-settings" data-title="設定">
        <div class="card static">
          <div style="font-weight:600;margin-bottom:8px">帳號同步（Supabase）</div>
          <div id="auth-panel"></div>
        </div>
        <div class="card static">
          <div style="font-weight:600;margin-bottom:8px">資料來源</div>
          <div style="font-size:14px;color:var(--text-secondary);line-height:1.5">報價：騰訊財經 qt.gtimg.cn<br />企業日程：Yahoo Finance（除淨／派息／拆股）<br />行情可能有延遲</div>
        </div>
        <div class="card static">
          <div style="font-weight:600;margin-bottom:8px">重新整理間隔</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="pill interval-btn active" data-ms="0">永不</button>
            <button class="pill interval-btn" data-ms="60000">1 分鐘</button>
            <button class="pill interval-btn" data-ms="300000">5 分鐘</button>
          </div>
        </div>
        <div class="card static">
          <div style="font-weight:600;margin-bottom:12px">自選清單</div>
          <button class="pill" id="btn-clear" style="width:100%">清空全部自選</button>
        </div>
        <div class="card static" style="text-align:center;color:var(--text-tertiary);font-size:13px">Quote PWA · 支援 Notch / Dynamic Island</div>
      </section>
    </div>
    <nav class="bottom-nav" role="navigation">
      <button class="nav-item active" data-page="watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>自選</span></button>
